<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PiP Camera</title>
    <link rel="stylesheet" href="pip-styles.css" />
    <script src="node_modules/hls.js/dist/hls.min.js"></script>
  </head>

  <body>
    <div class="pip-container" id="pip-container">
      <div class="pip-header" id="pip-header" style="display: none">
        <div class="pip-title" id="pip-camera-name">Camera</div>
        <div class="pip-controls">
          <button id="close-btn" class="pip-btn" title="Chiudi">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="pip-video-container">
        <video id="pip-video" autoplay playsinline style="display: none"></video>
        <img id="mjpeg-stream" style="display: none; width: 100%; height: 100%; object-fit: cover" alt="Stream Camera" />

        <div class="pip-loading" id="pip-loading">
          <div class="pip-loading-spinner"></div>
          <div class="pip-loading-text">Caricamento...</div>
        </div>

        <div class="pip-overlay">
          <div class="pip-overlay-top">
            <div class="pip-stream-badge" id="pip-stream-badge">MJPEG</div>

            <button id="audio-btn" class="audio-btn" title="Audio" style="display: none">
              <svg id="mute-icon" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
              </svg>
              <svg id="unmute-icon" xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
              </svg>
            </button>

            <button id="timer-lock-btn" class="timer-lock-btn" title="Blocca/Sblocca Timer">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 2v4"></path>
                <path d="m16.2 7.8 2.9-2.9"></path>
                <path d="M18 12h4"></path>
                <path d="m16.2 16.2 2.9 2.9"></path>
                <path d="M12 18v4"></path>
                <path d="m4.9 19.1 2.9-2.9"></path>
                <path d="M2 12h4"></path>
                <path d="m4.9 4.9 2.9 2.9"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>

            <button id="floating-close-btn" class="floating-close-btn" title="Chiudi">
              <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="6" x2="6" y2="18"></line>
                <line x1="6" y1="6" x2="18" y2="18"></line>
              </svg>
            </button>
          </div>

          <div class="pip-overlay-bottom">
            <div class="pip-camera-label" id="pip-overlay-camera-name"></div>
          </div>
        </div>
      </div>

      <div class="pip-timer">
        <div class="timer-bar" id="timer-bar"></div>
        <div class="timer-text" id="timer-text">10s</div>
      </div>
    </div>

    <script>
      const { ipcRenderer } = require("electron");

      const pipContainer = document.getElementById("pip-container");
      const pipHeader = document.getElementById("pip-header");
      const pipVideo = document.getElementById("pip-video");
      const mjpegStream = document.getElementById("mjpeg-stream");
      const pipLoading = document.getElementById("pip-loading");
      const pipCameraName = document.getElementById("pip-camera-name");
      const pipOverlayCameraName = document.getElementById("pip-overlay-camera-name");
      const streamBadge = document.getElementById("pip-stream-badge");

      const muteIcon = document.getElementById("mute-icon");
      const unmuteIcon = document.getElementById("unmute-icon");
      const closeBtn = document.getElementById("close-btn");
      const floatingCloseBtn = document.getElementById("floating-close-btn");
      const audioBtn = document.getElementById("audio-btn");
      const timerBar = document.getElementById("timer-bar");
      const timerText = document.getElementById("timer-text");
      const timerLockBtn = document.getElementById("timer-lock-btn");

      let isMuted = true;
      let timerInterval;
      let remainingTime = 10;
      let totalTime = 10;
      let fallbackTimeout;
      let isTimerPaused = false;
      let isTimerLocked = false;

      document.addEventListener("DOMContentLoaded", () => {
        setupEventListeners();
        pipContainer.style.opacity = "1";
        pipContainer.style.visibility = "visible";
      });

      ipcRenderer.on("load-camera", (event, config) => {
        loadCamera(config);
      });

      ipcRenderer.on("restart-timer", (event, config) => {
        restartTimer(config.duration);
      });

      ipcRenderer.on("close-window-anim", () => {
        animateWindowClose();
      });

      ipcRenderer.on("window-open-anim", () => {
        animateWindowOpen();
      });

      function getErrorHtml(message, detail, url) {
        const urlSnippet = url ? `<small>${url.substring(0, 50)}${url.length > 50 ? "..." : ""}</small>` : "";
        return `
          <div class="error-message">
            <svg class="error-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="12" y1="8" x2="12" y2="12"></line>
              <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <p>${message}</p>
            ${detail ? `<p>${detail}</p>` : ""}
            ${urlSnippet}
          </div>
        `;
      }

      function loadCamera(config) {
        console.log("Caricamento camera con config:", config);
        const { url, duration, useHLS, streamType, cameraName } = config;

        if (!url) {
          console.error("URL video non fornito");
          pipLoading.innerHTML = getErrorHtml("URL video non fornito");
          return;
        }

        window.cameraUrl = url;

        if (cameraName) {
          pipCameraName.textContent = cameraName;
          pipOverlayCameraName.textContent = cameraName;
        }

        totalTime = parseInt(duration) || 10;
        remainingTime = totalTime;
        updateTimerDisplay();

        pipVideo.style.display = "none";
        mjpegStream.style.display = "none";
        audioBtn.style.display = "none";

        const actualStreamType = streamType || "mjpeg";
        console.log(`Tipo di stream: ${actualStreamType}`);

        requestAnimationFrame(() => {
          if (actualStreamType === "hls") {
            streamBadge.textContent = "HLS...";
            streamBadge.dataset.type = "hls";
            loadHlsStream(url);
          } else if (actualStreamType === "mjpeg") {
            streamBadge.textContent = "MJPEG";
            streamBadge.dataset.type = "mjpeg";
            loadMjpegStream(url);
          } else {
            streamBadge.textContent = "MP4";
            streamBadge.dataset.type = "mp4";
            loadStandardVideo(url);
          }
        });
      }

      function loadHlsStream(url) {
        console.log(`Caricamento stream HLS da: ${url}`);

        try {
          mjpegStream.style.display = "none";
          pipVideo.style.display = "block";
          audioBtn.style.display = "flex";

          isMuted = true;
          pipVideo.muted = isMuted;
          updateMuteButton();

          if (Hls.isSupported()) {
            console.log("HLS.js supportato, inizializzazione...");
            const hls = new Hls({
              debug: false,
              enableWorker: true,
              lowLatencyMode: true,
              backBufferLength: 3,
              maxBufferLength: 5,
              maxMaxBufferLength: 15,
              liveSyncDurationCount: 1,
              liveMaxLatencyDurationCount: 3,
              startLevel: 0,
              startFragPrefetch: true,
              abrEwmaDefaultEstimate: 500000,
              manifestLoadingTimeOut: 4000,
              manifestLoadingMaxRetry: 2,
              levelLoadingTimeOut: 4000,
              levelLoadingMaxRetry: 2,
              fragLoadingTimeOut: 6000,
              fragLoadingMaxRetry: 2,
            });

            hls.attachMedia(pipVideo);
            hls.loadSource(url);

            pipVideo.addEventListener("loadedmetadata", function onMeta() {
              pipVideo.removeEventListener("loadedmetadata", onMeta);
            });

            hls.on(Hls.Events.FRAG_LOADED, function () {
              if (pipLoading.style.display !== "none") {
                pipLoading.style.display = "none";
              }
            });

            hls.on(Hls.Events.MANIFEST_PARSED, function () {
              console.log("Manifest HLS caricato con successo");
              pipVideo.style.display = "block";
              pipLoading.style.display = "none";
              streamBadge.textContent = "HLS";
              streamBadge.dataset.type = "hls";
              pipVideo.play().catch((error) => {
                console.error("Errore nella riproduzione automatico:", error);
              });
              startTimer();
            });

            hls.on(Hls.Events.ERROR, function (event, data) {
              if (data.fatal) {
                switch (data.type) {
                  case Hls.ErrorTypes.NETWORK_ERROR:
                    console.error("Errore di rete HLS, tentativo fallback MJPEG:", data);
                    hls.destroy();
                    window.hlsInstance = null;
                    mjpegStream.style.display = "none";
                    mjpegStream.src = "";
                    pipVideo.style.display = "block";
                    streamBadge.textContent = "MJPEG";
                    streamBadge.dataset.type = "mjpeg";
                    loadMjpegStream(url);
                    return;
                  case Hls.ErrorTypes.MEDIA_ERROR:
                    console.error("Errore media HLS:", data);
                    hls.recoverMediaError();
                    break;
                  default:
                    console.error("Errore fatale HLS, fallback MJPEG:", data);
                    hls.destroy();
                    window.hlsInstance = null;
                    mjpegStream.style.display = "none";
                    mjpegStream.src = "";
                    pipVideo.style.display = "block";
                    streamBadge.textContent = "MJPEG";
                    streamBadge.dataset.type = "mjpeg";
                    loadMjpegStream(url);
                    return;
                }
              }
            });

            window.hlsInstance = hls;
          } else if (pipVideo.canPlayType("application/vnd.apple.mpegurl")) {
            console.log("Supporto HLS nativo rilevato");
            pipVideo.src = url;

            pipVideo.addEventListener("loadedmetadata", function () {
              console.log("Video HLS caricato con successo");
              pipLoading.style.display = "none";
              pipVideo.play().catch((error) => {
                console.error("Errore nella riproduzione automatica:", error);
              });
              startTimer();
            });

            pipVideo.addEventListener("error", function () {
              console.error("Errore nel caricamento del video HLS, fallback MJPEG");
              streamBadge.textContent = "MJPEG";
              streamBadge.dataset.type = "mjpeg";
              loadMjpegStream(url);
            });
          } else {
            console.error("HLS non supportato in questo browser");
            pipLoading.innerHTML = getErrorHtml(
              "HLS non supportato",
              "Disabilita HLS nelle impostazioni"
            );
          }
        } catch (error) {
          console.error("Errore nell'inizializzazione dello stream HLS:", error);
          pipLoading.innerHTML = getErrorHtml("Errore inizializzazione HLS", error.message);
        }
      }

      function loadMjpegStream(url) {
        console.log(`Caricamento stream MJPEG da: ${url}`);

        try {
          pipVideo.style.display = "none";
          mjpegStream.style.display = "block";
          audioBtn.style.display = "none";

          const timestamp = Date.now();
          mjpegStream.src = `${url}${url.includes("?") ? "&" : "?"}_t=${timestamp}`;

          const loadTimeout = setTimeout(() => {
            if (pipLoading.style.display !== "none") {
              console.warn("Timeout caricamento MJPEG, mostro comunque");
              pipLoading.style.display = "none";
              startTimer();
            }
          }, 3000);

          mjpegStream.onload = () => {
            clearTimeout(loadTimeout);
            console.log("Stream MJPEG caricato con successo");
            pipLoading.style.display = "none";
            startTimer();
          };

          mjpegStream.onerror = () => {
            clearTimeout(loadTimeout);
            console.error("Errore nel caricamento dello stream MJPEG");
            pipLoading.innerHTML = getErrorHtml(
              "Errore caricamento MJPEG",
              "Verifica URL e connessione",
              url
            );
          };
        } catch (error) {
          console.error("Errore nell'inizializzazione dello stream MJPEG:", error);
          pipLoading.innerHTML = getErrorHtml("Errore inizializzazione MJPEG", error.message);
        }
      }

      function loadStandardVideo(url) {
        console.log(`Caricamento video standard da: ${url}`);

        isMuted = true;
        pipVideo.muted = isMuted;
        updateMuteButton();
        audioBtn.style.display = "none";

        try {
          pipVideo.style.display = "block";

          if (pipVideo.src !== url) {
            pipVideo.pause();
            pipVideo.currentTime = 0;
          }

          pipVideo.crossOrigin = "anonymous";
          pipVideo.playsInline = true;
          pipVideo.muted = isMuted;
          pipVideo.preload = "auto";
          pipVideo.src = url;

          const loadTimeout = setTimeout(() => {
            if (pipLoading.style.display !== "none") {
              console.warn("Timeout caricamento video, mostro comunque");
              pipLoading.style.display = "none";
              startTimer();
            }
          }, 4000);

          const handleLoadedData = () => {
            clearTimeout(loadTimeout);
            console.log("Video caricato con successo");
            pipLoading.style.display = "none";
            pipVideo.style.display = "block";
            startTimer();
            pipVideo.removeEventListener("loadeddata", handleLoadedData);
            pipVideo.removeEventListener("error", handleError);
          };

          const handleError = () => {
            clearTimeout(loadTimeout);
            console.error("Errore nel caricamento del video");
            let errorMessage = "Errore nel caricamento del video";

            if (pipVideo.error) {
              switch (pipVideo.error.code) {
                case pipVideo.error.MEDIA_ERR_ABORTED:
                  errorMessage = "Caricamento video interrotto";
                  break;
                case pipVideo.error.MEDIA_ERR_NETWORK:
                  errorMessage = "Errore di rete nel caricamento";
                  break;
                case pipVideo.error.MEDIA_ERR_DECODE:
                  errorMessage = "Errore di decodifica video";
                  break;
                case pipVideo.error.MEDIA_ERR_SRC_NOT_SUPPORTED:
                  errorMessage = "Formato non supportato o URL non valido";
                  break;
              }
            }

            pipLoading.innerHTML = getErrorHtml(errorMessage, "Verifica URL e connessione", url);
          };

          pipVideo.addEventListener("loadeddata", handleLoadedData, { once: true });
          pipVideo.addEventListener("error", handleError, { once: true });

          pipVideo.load().catch((error) => {
            clearTimeout(loadTimeout);
            console.error("Errore nel caricamento forzato del video:", error);
            handleError();
          });
        } catch (error) {
          console.error("Errore nell'inizializzazione del video:", error);
          pipLoading.innerHTML = getErrorHtml("Errore inizializzazione video", error.message);
        }
      }

      function setupEventListeners() {
        closeBtn.addEventListener("click", closeWindow);
        floatingCloseBtn.addEventListener("click", closeWindow);
        audioBtn.addEventListener("click", toggleMute);
        timerLockBtn.addEventListener("click", toggleTimerLock);

        pipContainer.addEventListener("contextmenu", (e) => {
          e.preventDefault();
        });
      }

      function toggleMute() {
        isMuted = !isMuted;
        pipVideo.muted = isMuted;
        updateMuteButton();
      }

      function toggleTimerLock() {
        isTimerLocked = !isTimerLocked;

        if (isTimerLocked) {
          pauseTimer();
          timerLockBtn.classList.add("locked");
          timerLockBtn.title = "Sblocca Timer";
        } else {
          resumeTimer();
          timerLockBtn.classList.remove("locked");
          timerLockBtn.title = "Blocca Timer";
        }
      }

      function updateMuteButton() {
        if (isMuted) {
          muteIcon.style.display = "block";
          unmuteIcon.style.display = "none";
        } else {
          muteIcon.style.display = "none";
          unmuteIcon.style.display = "block";
        }
      }

      function closeWindow() {
        clearInterval(timerInterval);
        clearTimeout(fallbackTimeout);
        isTimerPaused = false;

        if (window.hlsInstance) {
          window.hlsInstance.destroy();
          window.hlsInstance = null;
        }

        if (pipVideo) {
          pipVideo.pause();
          pipVideo.src = "";
        }

        window.close();
      }

      function animateWindowClose() {
        const duration = 200;
        pipContainer.style.transition = `transform ${duration}ms cubic-bezier(0.4, 0, 1, 1), opacity ${duration}ms cubic-bezier(0.4, 0, 1, 1)`;
        pipContainer.style.transform = "scale(0.85)";
        pipContainer.style.opacity = "0";

        setTimeout(() => {
          closeWindow();
        }, duration);
      }

      function animateWindowOpen() {
        const duration = 300;
        pipContainer.style.transform = "scale(0.85)";
        pipContainer.style.opacity = "0";
        pipContainer.offsetHeight;

        pipContainer.style.transition = `transform ${duration}ms cubic-bezier(0.16, 1, 0.3, 1), opacity ${duration}ms cubic-bezier(0.16, 1, 0.3, 1)`;
        pipContainer.style.transform = "scale(1)";
        pipContainer.style.opacity = "1";
      }

      function startTimer() {
        if (isTimerPaused) {
          console.log("Timer in pausa, non avvio");
          return;
        }

        clearInterval(timerInterval);
        clearTimeout(fallbackTimeout);

        if (isNaN(totalTime) || totalTime <= 0) {
          totalTime = 10;
          remainingTime = 10;
        }

        timerInterval = setInterval(() => {
          remainingTime--;
          updateTimerDisplay();

          if (remainingTime <= 0) {
            clearInterval(timerInterval);
            clearTimeout(fallbackTimeout);
            closeWindow();
          }
        }, 1000);

        fallbackTimeout = setTimeout(
          () => {
            if (timerInterval) {
              clearInterval(timerInterval);
              closeWindow();
            }
          },
          (totalTime + 5) * 1000,
        );
      }

      function updateTimerDisplay() {
        const percentage = (remainingTime / totalTime) * 100;
        timerBar.style.width = `${percentage}%`;
        timerText.textContent = `${remainingTime}s`;

        timerText.className = "timer-text";

        if (remainingTime <= 3) {
          timerBar.style.backgroundColor = "var(--error)";
          timerText.classList.add("timer-danger");
        } else if (remainingTime <= 5) {
          timerBar.style.backgroundColor = "var(--warning)";
          timerText.classList.add("timer-warning");
        } else {
          timerBar.style.backgroundColor = "var(--success)";
        }
      }

      function pauseTimer() {
        if (isTimerPaused) {
          console.log("Timer gia in pausa, ignoro richiesta");
          return;
        }
        isTimerPaused = true;
        clearInterval(timerInterval);
        clearTimeout(fallbackTimeout);
        console.log("Timer in pausa - Tempo rimanente:", remainingTime);

        timerText.className = "timer-text";

        if (isTimerLocked) {
          timerText.textContent = `${remainingTime}s Bloccato`;
          timerBar.style.backgroundColor = "var(--locked)";
          timerText.classList.add("timer-locked");
        } else {
          timerText.textContent = `${remainingTime}s Pausa`;
          timerBar.style.backgroundColor = "var(--info)";
          timerText.classList.add("timer-info");
        }
      }

      function resumeTimer() {
        if (!isTimerPaused) {
          console.log("Timer non in pausa, ignoro richiesta di ripresa");
          return;
        }
        if (isTimerLocked) {
          console.log("Timer bloccato manualmente, non riprendo");
          return;
        }
        isTimerPaused = false;
        console.log("Timer ripreso - Tempo rimanente:", remainingTime);
        updateTimerDisplay();
        startTimer();
      }

      function restartTimer(newDuration) {
        console.log(`Riavvio timer con nuova durata: ${newDuration} secondi`);

        if (isTimerLocked) {
          console.log("Timer bloccato manualmente, aggiorno solo la durata");
          totalTime = parseInt(newDuration) || 10;
          remainingTime = totalTime;
          updateTimerDisplay();
          timerText.className = "timer-text timer-locked";
          timerText.textContent = `${remainingTime}s Bloccato`;
          timerBar.style.backgroundColor = "var(--locked)";
          return;
        }

        if (timerInterval) {
          clearInterval(timerInterval);
        }
        clearTimeout(fallbackTimeout);
        isTimerPaused = false;

        totalTime = parseInt(newDuration) || 10;
        remainingTime = totalTime;
        updateTimerDisplay();

        startTimer();

        timerText.className = "timer-text timer-info";
        timerBar.style.backgroundColor = "var(--info)";
        setTimeout(() => {
          updateTimerDisplay();
        }, 500);
      }

      function updateTheme() {
        const isDarkMode = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (isDarkMode) {
          document.documentElement.setAttribute("data-theme", "dark");
        } else {
          document.documentElement.setAttribute("data-theme", "light");
        }
      }

      updateTheme();

      if (window.matchMedia) {
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", updateTheme);
      }
    </script>
  </body>
</html>
