name: Build and Release

on:
  push:
    tags:
      - 'v*'

env:
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  set_version:
    runs-on: ubuntu-latest
    container:
      image: electronuserland/builder:wine
    outputs:
      build_version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version and generate changelog
        id: version
        run: |
          BUILD_VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$BUILD_VERSION" >> $GITHUB_OUTPUT
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV

          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREVIOUS_TAG" ]; then
            git log --pretty=format:"- %s" "${PREVIOUS_TAG}..${GITHUB_REF#refs/tags/}" > changelog.txt
          else
            git log --pretty=format:"- %s" --max-count=20 > changelog.txt
          fi

      - name: Upload changelog
        uses: actions/upload-artifact@v3
        with:
          name: changelog
          path: changelog.txt

  build_appimage:
    runs-on: ubuntu-latest
    container:
      image: electronuserland/builder:wine
    needs: [set_version]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache electron
        uses: actions/cache@v3
        with:
          path: |
            .cache/electron
            .cache/electron-builder
            node_modules/
          key: ${{ github.ref_name }}

      - name: Install dependencies
        run: |
          npm install
          npm audit --audit-level=critical

      - name: Build AppImage
        run: npm run build-appimage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v3
        with:
          name: appimage
          path: dist/*.AppImage
          retention-days: 30

  build_deb:
    runs-on: ubuntu-latest
    container:
      image: electronuserland/builder:wine
    needs: [set_version]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache electron
        uses: actions/cache@v3
        with:
          path: |
            .cache/electron
            .cache/electron-builder
            node_modules/
          key: ${{ github.ref_name }}

      - name: Install dependencies
        run: |
          npm install
          npm audit --audit-level=critical

      - name: Build DEB
        run: npm run build-deb

      - name: Upload DEB artifact
        uses: actions/upload-artifact@v3
        with:
          name: deb
          path: dist/*.deb
          retention-days: 30

  build_rpm:
    runs-on: ubuntu-latest
    container:
      image: electronuserland/builder:wine
    needs: [set_version]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache electron
        uses: actions/cache@v3
        with:
          path: |
            .cache/electron
            .cache/electron-builder
            node_modules/
          key: ${{ github.ref_name }}

      - name: Install dependencies
        run: |
          npm install
          npm audit --audit-level=critical

      - name: Build RPM
        run: npm run build-rpm

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v3
        with:
          name: rpm
          path: dist/*.rpm
          retention-days: 30

  build_windows:
    runs-on: ubuntu-latest
    container:
      image: electronuserland/builder:wine
    needs: [set_version]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache electron
        uses: actions/cache@v3
        with:
          path: |
            .cache/electron
            .cache/electron-builder
            node_modules/
          key: ${{ github.ref_name }}

      - name: Install dependencies
        run: |
          npm install
          npm audit --audit-level=critical

      - name: Build Windows
        run: npm run build-win

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v3
        with:
          name: windows
          path: dist/*.exe
          retention-days: 30

  create_release:
    runs-on: ubuntu-latest
    needs:
      - set_version
      - build_appimage
      - build_deb
      - build_rpm
      - build_windows
    steps:
      - name: Download changelog
        uses: actions/download-artifact@v3
        with:
          name: changelog

      - name: Download AppImage
        uses: actions/download-artifact@v3
        with:
          name: appimage
          path: dist/

      - name: Download DEB
        uses: actions/download-artifact@v3
        with:
          name: deb
          path: dist/

      - name: Download RPM
        uses: actions/download-artifact@v3
        with:
          name: rpm
          path: dist/

      - name: Download Windows
        uses: actions/download-artifact@v3
        with:
          name: windows
          path: dist/

      - name: Create release description
        run: |
          CHANGELOG=$(cat changelog.txt)
          cat > release_desc.md <<ENDOFDESC
          ## HomeSentinel ${{ needs.set_version.outputs.build_version }}

          ### Commits

          ${CHANGELOG}

          Scarica il pacchetto per la tua piattaforma dalla sezione Assets qui sotto.
          ENDOFDESC

      - name: Create Forgejo Release
        uses: https://code.forgejo.org/forgejo/release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: "HomeSentinel v${{ needs.set_version.outputs.build_version }}"
          body_path: release_desc.md