image: electronuserland/builder:wine

stages:
  - build
  - release

variables:
  ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
  ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/electron
    - .cache/electron-builder
    - node_modules/

before_script:
  - npm ci

#
# DEV BUILD
#
build_dev:
  stage: build
  script:
    - npm run build-linux
  artifacts:
    name: "dev-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/*.AppImage
      - dist/*.deb
      - dist/*.rpm
    expire_in: 2 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'

#
# RELEASE BUILD
#
build_release:
  stage: build
  script:
    - npm run build-linux
    - npm run build-win
  artifacts:
    name: "$CI_COMMIT_TAG"
    paths:
      - dist/*
  expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_TAG'

#
# GITLAB RELEASE
#
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - build_release
  rules:
    - if: '$CI_COMMIT_TAG'
  release:
    tag_name: '$CI_COMMIT_TAG'
    name: 'Release $CI_COMMIT_TAG'
    description: |
      Release automatica generata da GitLab CI.