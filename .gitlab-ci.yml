image: electronuserland/builder:wine

stages:
  - version
  - build
  - release

variables:
  ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
  ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/electron
    - .cache/electron-builder
    - node_modules/

before_script:
  - npm install

set_version:
  stage: version
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        BUILD_VERSION="${CI_COMMIT_TAG#v}"
        if [[ "$BUILD_VERSION" == *"-beta"* ]]; then
          PIPELINE_TYPE="beta"
          RELEASE_NAME="HA-Cam v${BUILD_VERSION} (Beta)"
        else
          PIPELINE_TYPE="stable"
          RELEASE_NAME="HA-Cam v${BUILD_VERSION}"
        fi
        RELEASE_TAG="${CI_COMMIT_TAG}"
      else
        CURRENT_VERSION=$(node -p "require('./package.json').version")
        BUILD_VERSION="${CURRENT_VERSION}-beta.${CI_PIPELINE_IID}"
        PIPELINE_TYPE="beta"
        RELEASE_NAME="HA-Cam v${BUILD_VERSION} (Beta)"
        RELEASE_TAG="v${BUILD_VERSION}"
      fi
      echo "PIPELINE_TYPE=$PIPELINE_TYPE" >> build.env
      echo "BUILD_VERSION=$BUILD_VERSION" >> build.env
      echo "RELEASE_NAME=$RELEASE_NAME" >> build.env
      echo "RELEASE_TAG=$RELEASE_TAG" >> build.env
      echo "Setting version to $BUILD_VERSION"
      node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version='$BUILD_VERSION';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "dev"
      changes:
        - package.json

build_appimage:
  stage: build
  needs: [set_version]
  script:
    - npm run build-appimage
    - |
      echo "APPIMAGE_JOB_ID=$CI_JOB_ID" >> appimage.env
      FILENAME=$(ls dist/*.AppImage 2>/dev/null | head -1)
      BASENAME=$(basename "$FILENAME" 2>/dev/null)
      echo "APPIMAGE_FILE=$BASENAME" >> appimage.env
      echo "Found: $BASENAME"
  artifacts:
    paths:
      - dist/*.AppImage
    reports:
      dotenv: appimage.env
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "dev"
      changes:
        - package.json

build_deb:
  stage: build
  needs: [set_version]
  script:
    - npm run build-deb
    - |
      echo "DEB_JOB_ID=$CI_JOB_ID" >> deb.env
      FILENAME=$(ls dist/*.deb 2>/dev/null | head -1)
      BASENAME=$(basename "$FILENAME" 2>/dev/null)
      echo "DEB_FILE=$BASENAME" >> deb.env
      echo "Found: $BASENAME"
  artifacts:
    paths:
      - dist/*.deb
    reports:
      dotenv: deb.env
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "dev"
      changes:
        - package.json

build_rpm:
  stage: build
  needs: [set_version]
  script:
    - npm run build-rpm
    - |
      echo "RPM_JOB_ID=$CI_JOB_ID" >> rpm.env
      FILENAME=$(ls dist/*.rpm 2>/dev/null | head -1)
      BASENAME=$(basename "$FILENAME" 2>/dev/null)
      echo "RPM_FILE=$BASENAME" >> rpm.env
      echo "Found: $BASENAME"
  artifacts:
    paths:
      - dist/*.rpm
    reports:
      dotenv: rpm.env
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "dev"
      changes:
        - package.json

build_windows:
  stage: build
  needs: [set_version]
  script:
    - npm run build-win
    - |
      echo "WINDOWS_JOB_ID=$CI_JOB_ID" >> windows.env
      FILENAME=$(ls dist/*.exe 2>/dev/null | head -1)
      BASENAME=$(basename "$FILENAME" 2>/dev/null)
      echo "EXE_FILE=$BASENAME" >> windows.env
      echo "Found: $BASENAME"
  artifacts:
    paths:
      - dist/*.exe
    reports:
      dotenv: windows.env
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "dev"
      changes:
        - package.json

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_appimage
      artifacts: true
    - job: build_deb
      artifacts: true
    - job: build_rpm
      artifacts: true
    - job: build_windows
      artifacts: true
    - job: set_version
  variables:
    GIT_STRATEGY: none
  before_script:
    - echo "skip"
  script:
    - echo "Creating $RELEASE_NAME ($RELEASE_TAG)"
    - ls dist/
  release:
    tag_name: $RELEASE_TAG
    name: $RELEASE_NAME
    description: "## HA-Cam ${BUILD_VERSION} - ${PIPELINE_TYPE}\nCommit: ${CI_COMMIT_SHORT_SHA}\n\nScarica il pacchetto per la tua piattaforma dalla sezione Assets qui sotto."
    assets:
      links:
        - name: "Windows Installer (.exe)"
          url: "${CI_PROJECT_URL}/-/jobs/${WINDOWS_JOB_ID}/artifacts/raw/dist/${EXE_FILE}"
          link_type: "package"
        - name: "Linux AppImage"
          url: "${CI_PROJECT_URL}/-/jobs/${APPIMAGE_JOB_ID}/artifacts/raw/dist/${APPIMAGE_FILE}"
          link_type: "package"
        - name: "Linux Debian/Ubuntu (.deb)"
          url: "${CI_PROJECT_URL}/-/jobs/${DEB_JOB_ID}/artifacts/raw/dist/${DEB_FILE}"
          link_type: "package"
        - name: "Linux Fedora/openSUSE (.rpm)"
          url: "${CI_PROJECT_URL}/-/jobs/${RPM_JOB_ID}/artifacts/raw/dist/${RPM_FILE}"
          link_type: "package"
  rules:
    - if: $CI_COMMIT_TAG
