image: electronuserland/builder:wine

stages:
  - build

variables:
  ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
  ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/electron
    - .cache/electron-builder
    - node_modules/

before_script:
  - npm ci

# =========================
# LINUX x64
# =========================
build_linux_x64:
  stage: build
  script:
    - npx electron-builder --linux AppImage deb rpm --x64
  artifacts:
    paths:
      - dist/*x64*.AppImage
      - dist/*x64*.deb
      - dist/*x64*.rpm
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_TAG'

# =========================
# LINUX arm64
# =========================
build_linux_arm64:
  stage: build
  script:
    # Se usi moduli nativi lascia questa riga, altrimenti puoi rimuoverla
    - npx electron-builder install-app-deps --arch=arm64
    - npx electron-builder --linux AppImage deb rpm --arm64
  artifacts:
    paths:
      - dist/*arm64*.AppImage
      - dist/*arm64*.deb
      - dist/*arm64*.rpm
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_TAG'

# =========================
# WINDOWS x64
# =========================
build_windows:
  stage: build
  script:
    - npx electron-builder --win nsis --x64
  artifacts:
    paths:
      - dist/*.exe
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_TAG'
