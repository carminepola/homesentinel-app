image: electronuserland/builder:wine

stages:
  - version
  - build
  - release

variables:
  ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
  ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/electron
    - .cache/electron-builder
    - node_modules/

before_script:
  - npm install

.determine_version: &determine_version |
  CURRENT_VERSION=$(node -p "require('./package.json').version")
  if [ "$CI_COMMIT_BRANCH" = "main" ]; then
    PIPELINE_TYPE="stable"
    BUILD_VERSION="${CURRENT_VERSION}+${CI_PIPELINE_IID}"
    RELEASE_NAME="HA-Cam v${BUILD_VERSION}"
    RELEASE_TAG="v${BUILD_VERSION}"
  else
    PIPELINE_TYPE="beta"
    BUILD_VERSION="${CURRENT_VERSION}-beta.${CI_PIPELINE_IID}"
    RELEASE_NAME="HA-Cam v${BUILD_VERSION} (Beta)"
    RELEASE_TAG="v${BUILD_VERSION}"
  fi
  echo "CURRENT_VERSION=$CURRENT_VERSION" >> build.env
  echo "PIPELINE_TYPE=$PIPELINE_TYPE" >> build.env
  echo "BUILD_VERSION=$BUILD_VERSION" >> build.env
  echo "RELEASE_NAME=$RELEASE_NAME" >> build.env
  echo "RELEASE_TAG=$RELEASE_TAG" >> build.env

set_version:
  stage: version
  script:
    - *determine_version
    - echo "Setting version to $BUILD_VERSION"
    - npm version --no-git-tag-version $BUILD_VERSION
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

build_linux:
  stage: build
  needs: [set_version]
  script:
    - npm run build-linux
  artifacts:
    paths:
      - dist/*.AppImage
      - dist/*.deb
      - dist/*.rpm
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

build_windows:
  stage: build
  needs: [set_version]
  script:
    - npm run build-win
  artifacts:
    paths:
      - dist/*.exe
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [build_linux, build_windows, set_version]
  variables:
    GIT_STRATEGY: none
  before_script:
    - echo "Skipping npm install for release job"
  script:
    - echo "Creating $RELEASE_NAME ($RELEASE_TAG)"
  release:
    tag_name: $RELEASE_TAG
    name: $RELEASE_NAME
    description: |
      ## HA-Cam ${BUILD_VERSION}

      **Tipo:** ${PIPELINE_TYPE} — Commit: ${CI_COMMIT_SHORT_SHA}

      ### Installazione

      - **Windows:** Scarica il file `.exe`
      - **Linux:** Scarica `.AppImage` (universale), `.deb` (Debian/Ubuntu) o `.rpm` (Fedora/openSUSE)

      ${PIPELINE_TYPE} == "beta" && echo "⚠️ **Questa è una versione beta** — potrebbe contenere bug." || echo "✅ **Versione stabile** — pronta per la produzione."
    assets:
      links:
        - name: "Windows (.exe)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/dist/Ha-cam-Setup.exe?job=build_windows"
          link_type: "package"
          filepath: "/Ha-cam-Setup.exe"
        - name: "Linux AppImage"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/dist/Ha-cam-${BUILD_VERSION}.AppImage?job=build_linux"
          link_type: "package"
          filepath: "/Ha-cam-AppImage"
        - name: "Linux .deb"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/dist/ha-cam_${BUILD_VERSION}_amd64.deb?job=build_linux"
          link_type: "package"
          filepath: "/Ha-cam.deb"
        - name: "Linux .rpm"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/artifacts/${CI_COMMIT_REF_NAME}/raw/dist/ha-cam-${BUILD_VERSION}.x86_64.rpm?job=build_linux"
          link_type: "package"
          filepath: "/Ha-cam.rpm"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
