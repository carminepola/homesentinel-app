image: electronuserland/builder:wine

stages:
  - version
  - build
  - release

variables:
  ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
  ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/electron
    - .cache/electron-builder
    - node_modules/

before_script:
  - npm install

.determine_version: &determine_version |
  CURRENT_VERSION=$(node -p "require('./package.json').version")
  if [ "$CI_COMMIT_BRANCH" = "main" ]; then
    PIPELINE_TYPE="stable"
    BUILD_VERSION="${CURRENT_VERSION}+${CI_PIPELINE_IID}"
    RELEASE_NAME="HA-Cam v${BUILD_VERSION}"
    RELEASE_TAG="v${BUILD_VERSION}"
  else
    PIPELINE_TYPE="beta"
    BUILD_VERSION="${CURRENT_VERSION}-beta.${CI_PIPELINE_IID}"
    RELEASE_NAME="HA-Cam v${BUILD_VERSION} (Beta)"
    RELEASE_TAG="v${BUILD_VERSION}"
  fi
  echo "CURRENT_VERSION=$CURRENT_VERSION" >> build.env
  echo "PIPELINE_TYPE=$PIPELINE_TYPE" >> build.env
  echo "BUILD_VERSION=$BUILD_VERSION" >> build.env
  echo "RELEASE_NAME=$RELEASE_NAME" >> build.env
  echo "RELEASE_TAG=$RELEASE_TAG" >> build.env

.build_linux_template: &build_linux_template
  stage: build
  needs: [set_version]
  script:
    - npm run $BUILD_CMD
    - echo "$ENV_JOB_ID_VAR=$CI_JOB_ID" >> $ENV_FILE
    - FILENAME=$(ls dist/$GLOB_PATTERN 2>/dev/null | head -1)
    - BASENAME=$(basename "$FILENAME" 2>/dev/null)
    - echo "$ENV_FILE_VAR=$BASENAME" >> $ENV_FILE
    - echo "Found: $BASENAME"
  artifacts:
    paths:
      - dist/$GLOB_PATTERN
    reports:
      dotenv: $ENV_FILE
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

build_appimage:
  variables:
    BUILD_CMD: build-appimage
    ENV_JOB_ID_VAR: APPIMAGE_JOB_ID
    ENV_FILE: appimage.env
    ENV_FILE_VAR: APPIMAGE_FILE
    GLOB_PATTERN: "*.AppImage"
  <<: *build_linux_template

build_deb:
  variables:
    BUILD_CMD: build-deb
    ENV_JOB_ID_VAR: DEB_JOB_ID
    ENV_FILE: deb.env
    ENV_FILE_VAR: DEB_FILE
    GLOB_PATTERN: "*.deb"
  <<: *build_linux_template

build_rpm:
  variables:
    BUILD_CMD: build-rpm
    ENV_JOB_ID_VAR: RPM_JOB_ID
    ENV_FILE: rpm.env
    ENV_FILE_VAR: RPM_FILE
    GLOB_PATTERN: "*.rpm"
  <<: *build_linux_template

build_windows:
  stage: build
  needs: [set_version]
  script:
    - npm run build-win
    - echo "WINDOWS_JOB_ID=$CI_JOB_ID" >> windows.env
    - FILENAME=$(ls dist/*.exe 2>/dev/null | head -1)
    - BASENAME=$(basename "$FILENAME" 2>/dev/null)
    - echo "EXE_FILE=$BASENAME" >> windows.env
    - echo "Found: $BASENAME"
  artifacts:
    paths:
      - dist/*.exe
    reports:
      dotenv: windows.env
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

set_version:
  stage: version
  script:
    - *determine_version
    - echo "Setting version to $BUILD_VERSION"
    - npm version --no-git-tag-version $BUILD_VERSION
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_appimage
      artifacts: true
    - job: build_deb
      artifacts: true
    - job: build_rpm
      artifacts: true
    - job: build_windows
      artifacts: true
    - job: set_version
  variables:
    GIT_STRATEGY: none
  before_script:
    - echo "skip"
  script:
    - echo "Creating $RELEASE_NAME ($RELEASE_TAG)"
    - ls dist/
  release:
    tag_name: $RELEASE_TAG
    name: $RELEASE_NAME
    description: "## HA-Cam ${BUILD_VERSION} - ${PIPELINE_TYPE}\nCommit: ${CI_COMMIT_SHORT_SHA}\n\nScarica il pacchetto per la tua piattaforma dalla sezione Assets qui sotto."
    assets:
      links:
        - name: "Windows Installer (.exe)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${WINDOWS_JOB_ID}/artifacts/raw/dist/${EXE_FILE}"
          link_type: "package"
        - name: "Linux AppImage"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${APPIMAGE_JOB_ID}/artifacts/raw/dist/${APPIMAGE_FILE}"
          link_type: "package"
        - name: "Linux Debian/Ubuntu (.deb)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${DEB_JOB_ID}/artifacts/raw/dist/${DEB_FILE}"
          link_type: "package"
        - name: "Linux Fedora/openSUSE (.rpm)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${RPM_JOB_ID}/artifacts/raw/dist/${RPM_FILE}"
          link_type: "package"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
