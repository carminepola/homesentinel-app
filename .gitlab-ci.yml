image: electronuserland/builder:wine

stages:
  - version
  - build
  - release

variables:
  ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
  ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/electron
    - .cache/electron-builder
    - node_modules/

before_script:
  - npm install

.determine_version: &determine_version |
  CURRENT_VERSION=$(node -p "require('./package.json').version")
  if [ "$CI_COMMIT_BRANCH" = "main" ]; then
    PIPELINE_TYPE="stable"
    BUILD_VERSION="${CURRENT_VERSION}+${CI_PIPELINE_IID}"
    RELEASE_NAME="HA-Cam v${BUILD_VERSION}"
    RELEASE_TAG="v${BUILD_VERSION}"
  else
    PIPELINE_TYPE="beta"
    BUILD_VERSION="${CURRENT_VERSION}-beta.${CI_PIPELINE_IID}"
    RELEASE_NAME="HA-Cam v${BUILD_VERSION} (Beta)"
    RELEASE_TAG="v${BUILD_VERSION}"
  fi
  echo "CURRENT_VERSION=$CURRENT_VERSION" >> build.env
  echo "PIPELINE_TYPE=$PIPELINE_TYPE" >> build.env
  echo "BUILD_VERSION=$BUILD_VERSION" >> build.env
  echo "RELEASE_NAME=$RELEASE_NAME" >> build.env
  echo "RELEASE_TAG=$RELEASE_TAG" >> build.env

set_version:
  stage: version
  script:
    - *determine_version
    - echo "Setting version to $BUILD_VERSION"
    - npm version --no-git-tag-version $BUILD_VERSION
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

build_linux:
  stage: build
  needs: [set_version]
  script:
    - npm run build-linux
    - echo "LINUX_JOB_ID=$CI_JOB_ID" >> linux.env
  artifacts:
    paths:
      - dist/*.AppImage
      - dist/*.deb
      - dist/*.rpm
    reports:
      dotenv: linux.env
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

build_windows:
  stage: build
  needs: [set_version]
  script:
    - npm run build-win
    - echo "WINDOWS_JOB_ID=$CI_JOB_ID" >> windows.env
  artifacts:
    paths:
      - dist/*.exe
    reports:
      dotenv: windows.env
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_linux
      artifacts: true
    - job: build_windows
      artifacts: true
    - job: set_version
  variables:
    GIT_STRATEGY: none
  before_script:
    - echo "skip"
  script:
    - echo "Creating $RELEASE_NAME ($RELEASE_TAG)"
    - ls dist/
  release:
    tag_name: $RELEASE_TAG
    name: $RELEASE_NAME
    description: "## HA-Cam ${BUILD_VERSION} - ${PIPELINE_TYPE}\nCommit: ${CI_COMMIT_SHORT_SHA}\n\nScarica il pacchetto per la tua piattaforma dalla sezione Assets qui sotto."
    assets:
      links:
        - name: "Windows Installer (.exe)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${WINDOWS_JOB_ID}/artifacts/raw/dist/Ha-cam Setup ${BUILD_VERSION}.exe"
          link_type: "package"
        - name: "Linux AppImage"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${LINUX_JOB_ID}/artifacts/raw/dist/Ha-cam-${BUILD_VERSION}.AppImage"
          link_type: "package"
        - name: "Linux Debian/Ubuntu (.deb)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${LINUX_JOB_ID}/artifacts/raw/dist/ha-cam_${BUILD_VERSION}_amd64.deb"
          link_type: "package"
        - name: "Linux Fedora/openSUSE (.rpm)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${LINUX_JOB_ID}/artifacts/raw/dist/ha-cam-${BUILD_VERSION}.x86_64.rpm"
          link_type: "package"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
