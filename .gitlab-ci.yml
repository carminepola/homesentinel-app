image: electronuserland/builder:wine

stages:
  - build
  - release

variables:
  ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
  ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/electron
    - .cache/electron-builder
    - node_modules/

before_script:
  - npm install
  - npm audit --audit-level=critical

build_all:
  stage: build
  variables:
    GIT_DEPTH: "0"
  script:
    - |
      BUILD_VERSION="${CI_COMMIT_TAG#v}"
      PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
      if [ -n "$PREVIOUS_TAG" ]; then
        git log --pretty=format:"- %s" "${PREVIOUS_TAG}..${CI_COMMIT_TAG}" > changelog.txt
      else
        git log --pretty=format:"- %s" --max-count=20 > changelog.txt
      fi
    - npm run build-appimage &
    - npm run build-deb &
    - npm run build-rpm &
    - npm run build-win &
    - wait
    - |
      APPIMAGE_FILE=$(ls dist/*.AppImage 2>/dev/null | head -1 | xargs -r basename)
      DEB_FILE=$(ls dist/*.deb 2>/dev/null | head -1 | xargs -r basename)
      RPM_FILE=$(ls dist/*.rpm 2>/dev/null | head -1 | xargs -r basename)
      EXE_FILE=$(ls dist/*.exe 2>/dev/null | head -1 | xargs -r basename)
      echo "BUILD_VERSION=$BUILD_VERSION" >> build.env
      echo "BUILD_JOB_ID=$CI_JOB_ID" >> build.env
      echo "APPIMAGE_FILE=$APPIMAGE_FILE" >> build.env
      echo "DEB_FILE=$DEB_FILE" >> build.env
      echo "RPM_FILE=$RPM_FILE" >> build.env
      echo "EXE_FILE=$EXE_FILE" >> build.env
  artifacts:
    paths:
      - dist/*
      - changelog.txt
    reports:
      dotenv: build.env
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_all
      artifacts: true
  variables:
    GIT_STRATEGY: none
  before_script:
    - echo "skip"
  script:
    - |
      CHANGELOG=$(cat changelog.txt)
      cat > release_desc.md <<ENDOFDESC
      ## HA-Cam ${BUILD_VERSION}

      ### Commits

      ${CHANGELOG}

      Scarica il pacchetto per la tua piattaforma dalla sezione Assets qui sotto.
      ENDOFDESC
  release:
    tag_name: $CI_COMMIT_TAG
    name: "HA-Cam v${BUILD_VERSION}"
    description: release_desc.md
    assets:
      links:
        - name: "Windows Installer (.exe)"
          url: "${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/dist/${EXE_FILE}"
          link_type: "package"
        - name: "Linux AppImage"
          url: "${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/dist/${APPIMAGE_FILE}"
          link_type: "package"
        - name: "Linux Debian/Ubuntu (.deb)"
          url: "${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/dist/${DEB_FILE}"
          link_type: "package"
        - name: "Linux Fedora/openSUSE (.rpm)"
          url: "${CI_PROJECT_URL}/-/jobs/${BUILD_JOB_ID}/artifacts/raw/dist/${RPM_FILE}"
          link_type: "package"
  rules:
    - if: $CI_COMMIT_TAG
