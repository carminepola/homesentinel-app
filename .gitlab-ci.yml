image: electronuserland/builder:wine

stages:
  - version
  - build
  - release

variables:
  ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
  ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/electron
    - .cache/electron-builder
    - node_modules/

before_script:
  - npm install

.determine_version: &determine_version |
  CURRENT_VERSION=$(node -p "require('./package.json').version")
  if [ "$CI_COMMIT_BRANCH" = "main" ]; then
    PIPELINE_TYPE="stable"
    BUILD_VERSION="${CURRENT_VERSION}+${CI_PIPELINE_IID}"
    RELEASE_NAME="HA-Cam v${BUILD_VERSION}"
    RELEASE_TAG="v${BUILD_VERSION}"
  else
    PIPELINE_TYPE="beta"
    BUILD_VERSION="${CURRENT_VERSION}-beta.${CI_PIPELINE_IID}"
    RELEASE_NAME="HA-Cam v${BUILD_VERSION} (Beta)"
    RELEASE_TAG="v${BUILD_VERSION}"
  fi
  echo "CURRENT_VERSION=$CURRENT_VERSION" >> build.env
  echo "PIPELINE_TYPE=$PIPELINE_TYPE" >> build.env
  echo "BUILD_VERSION=$BUILD_VERSION" >> build.env
  echo "RELEASE_NAME=$RELEASE_NAME" >> build.env
  echo "RELEASE_TAG=$RELEASE_TAG" >> build.env

set_version:
  stage: version
  script:
    - *determine_version
    - echo "Setting version to $BUILD_VERSION"
    - npm version --no-git-tag-version $BUILD_VERSION
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

build_appimage:
  stage: build
  needs: [set_version]
  script:
    - npm run build-appimage
    - echo "APPIMAGE_JOB_ID=$CI_JOB_ID" >> appimage.env
    - APPIMAGE_FILE=$(ls dist/*.AppImage 2>/dev/null | head -1 | xargs basename 2>/dev/null || echo "")
    - echo "APPIMAGE_FILE=$APPIMAGE_FILE" >> appimage.env
    - echo "Found: $APPIMAGE_FILE"
  artifacts:
    paths:
      - dist/*.AppImage
    reports:
      dotenv: appimage.env
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

build_deb:
  stage: build
  needs: [set_version]
  script:
    - npm run build-deb
    - echo "DEB_JOB_ID=$CI_JOB_ID" >> deb.env
    - DEB_FILE=$(ls dist/*.deb 2>/dev/null | head -1 | xargs basename 2>/dev/null || echo "")
    - echo "DEB_FILE=$DEB_FILE" >> deb.env
    - echo "Found: $DEB_FILE"
  artifacts:
    paths:
      - dist/*.deb
    reports:
      dotenv: deb.env
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

build_rpm:
  stage: build
  needs: [set_version]
  script:
    - npm run build-rpm
    - echo "RPM_JOB_ID=$CI_JOB_ID" >> rpm.env
    - RPM_FILE=$(ls dist/*.rpm 2>/dev/null | head -1 | xargs basename 2>/dev/null || echo "")
    - echo "RPM_FILE=$RPM_FILE" >> rpm.env
    - echo "Found: $RPM_FILE"
  artifacts:
    paths:
      - dist/*.rpm
    reports:
      dotenv: rpm.env
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

build_windows:
  stage: build
  needs: [set_version]
  script:
    - npm run build-win
    - echo "WINDOWS_JOB_ID=$CI_JOB_ID" >> windows.env
    - EXE_FILE=$(ls dist/*.exe 2>/dev/null | head -1 | xargs basename 2>/dev/null || echo "")
    - echo "EXE_FILE=$EXE_FILE" >> windows.env
    - echo "Found: $EXE_FILE"
  artifacts:
    paths:
      - dist/*.exe
    reports:
      dotenv: windows.env
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_appimage
      artifacts: true
    - job: build_deb
      artifacts: true
    - job: build_rpm
      artifacts: true
    - job: build_windows
      artifacts: true
    - job: set_version
  variables:
    GIT_STRATEGY: none
  before_script:
    - echo "skip"
  script:
    - echo "Creating $RELEASE_NAME ($RELEASE_TAG)"
    - ls dist/
  release:
    tag_name: $RELEASE_TAG
    name: $RELEASE_NAME
    description: "## HA-Cam ${BUILD_VERSION} - ${PIPELINE_TYPE}\nCommit: ${CI_COMMIT_SHORT_SHA}\n\nScarica il pacchetto per la tua piattaforma dalla sezione Assets qui sotto."
    assets:
      links:
        - name: "Windows Installer (.exe)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${WINDOWS_JOB_ID}/artifacts/raw/dist/${EXE_FILE}"
          link_type: "package"
        - name: "Linux AppImage"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${APPIMAGE_JOB_ID}/artifacts/raw/dist/${APPIMAGE_FILE}"
          link_type: "package"
        - name: "Linux Debian/Ubuntu (.deb)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${DEB_JOB_ID}/artifacts/raw/dist/${DEB_FILE}"
          link_type: "package"
        - name: "Linux Fedora/openSUSE (.rpm)"
          url: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${RPM_JOB_ID}/artifacts/raw/dist/${RPM_FILE}"
          link_type: "package"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
