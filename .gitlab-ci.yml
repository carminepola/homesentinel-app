image: electronuserland/builder:wine

stages:
  - version
  - build
  - release

variables:
  ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
  ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/electron
    - .cache/electron-builder
    - node_modules/

before_script:
  - npm install

.determine_version: &determine_version |
  CURRENT_VERSION=$(node -p "require('./package.json').version")
  if [ "$CI_COMMIT_BRANCH" = "main" ]; then
    PIPELINE_TYPE="stable"
    BUILD_VERSION="${CURRENT_VERSION}+${CI_PIPELINE_IID}"
    RELEASE_NAME="HA-Cam v${BUILD_VERSION}"
    RELEASE_TAG="v${BUILD_VERSION}"
  else
    PIPELINE_TYPE="beta"
    BUILD_VERSION="${CURRENT_VERSION}-beta.${CI_PIPELINE_IID}"
    RELEASE_NAME="HA-Cam v${BUILD_VERSION} (Beta)"
    RELEASE_TAG="v${BUILD_VERSION}"
  fi
  echo "CURRENT_VERSION=$CURRENT_VERSION" >> build.env
  echo "PIPELINE_TYPE=$PIPELINE_TYPE" >> build.env
  echo "BUILD_VERSION=$BUILD_VERSION" >> build.env
  echo "RELEASE_NAME=$RELEASE_NAME" >> build.env
  echo "RELEASE_TAG=$RELEASE_TAG" >> build.env

set_version:
  stage: version
  script:
    - *determine_version
    - echo "Setting version to $BUILD_VERSION"
    - npm version --no-git-tag-version $BUILD_VERSION
  artifacts:
    reports:
      dotenv: build.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

build_linux:
  stage: build
  needs: [set_version]
  script:
    - npm run build-linux
  artifacts:
    paths:
      - dist/*.AppImage
      - dist/*.deb
      - dist/*.rpm
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

build_windows:
  stage: build
  needs: [set_version]
  script:
    - npm run build-win
  artifacts:
    paths:
      - dist/*.exe
    expire_in: 30 days
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'

create_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build_linux
      artifacts: true
    - job: build_windows
      artifacts: true
    - job: set_version
  variables:
    GIT_STRATEGY: none
  before_script:
    - echo "skip"
  script:
    - echo "Artifacts in dist/:"
    - ls -la dist/
    - echo "Creating $RELEASE_NAME ($RELEASE_TAG)"
    - |
      ASSETS_ARGS=""
      for job_name in build_linux build_windows; do
        JOB_ID=$(curl --silent "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs?scope=success&per_page=50" \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" | jq -r ".[] | select(.name==\"${job_name}\") | .id" | head -1)
        echo "Found job ${job_name} with ID ${JOB_ID}"
        for file in $(curl --silent "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${JOB_ID}/artifacts" \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" | jq -r ".[].name" 2>/dev/null); do
          FILE_URL="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${JOB_ID}/artifacts/raw/${file}"
          echo "Adding asset: ${file}"
          ASSETS_ARGS="${ASSETS_ARGS} --assets-link {\"name\":\"${file}\",\"url\":\"${FILE_URL}\",\"link_type\":\"package\"}"
        done
      done
    - echo "Release assets: ${ASSETS_ARGS}"
    - |
      release-cli create \
        --name "$RELEASE_NAME" \
        --tag-name "$RELEASE_TAG" \
        --description "## HA-Cam ${BUILD_VERSION}

      **Tipo:** ${PIPELINE_TYPE} - Commit: ${CI_COMMIT_SHORT_SHA}

      ### Installazione

      - **Windows:** Scarica il file .exe
      - **Linux:** Scarica .AppImage (universale), .deb (Debian/Ubuntu) o .rpm (Fedora/openSUSE)" \
        ${ASSETS_ARGS}
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev"'
