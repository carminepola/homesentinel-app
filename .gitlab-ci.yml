image: electronuserland/builder:wine

stages:
  - build

variables:
  ELECTRON_CACHE: "$CI_PROJECT_DIR/.cache/electron"
  ELECTRON_BUILDER_CACHE: "$CI_PROJECT_DIR/.cache/electron-builder"

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .cache/electron
    - .cache/electron-builder
    - node_modules/

before_script:
  - npm install

build_linux:
  stage: build
  script:
    - npm run build-linux
  artifacts:
    paths:
      - dist/*.AppImage
      - dist/*.deb
      - dist/*.rpm
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_TAG'

build_windows:
  stage: build
  script:
    - npm run build-win
  artifacts:
    paths:
      - dist/*.exe
    expire_in: 7 days
  rules:
    - if: '$CI_COMMIT_TAG'
